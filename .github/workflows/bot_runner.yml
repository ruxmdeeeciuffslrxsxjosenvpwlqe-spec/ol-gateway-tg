name: Gateway TG Bot Runner

on:
  workflow_dispatch:
  schedule:
    # Runs every 5h40m — before the 355-minute timeout kills the run.
    # This ensures the bot is always restarted automatically.
    # Cron pattern: every 340 minutes ≈ 6 times per day offset staggered.
    - cron: "0 0,6,12,18 * * *"   # 4× daily at 00:00, 06:00, 12:00, 18:00 UTC

permissions:
  contents: read


concurrency:
  group: gateway-tg-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_IDS: ${{ secrets.GROUP_IDS }}
      GROUP_NAMES: ${{ secrets.GROUP_NAMES }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot loop (~5h45m)
        shell: bash
        run: |
          end=$((SECONDS + 20700))
          while [ $SECONDS -lt $end ]; do
            echo "Starting bot process..."
            python -u bot.py || true
            echo "Bot stopped; restarting in 5s..."
            sleep 5
          done
